substitutions:
  name: jkbms-senergy
  jk_bms_mac: "C8:47:8C:10:79:7A"
  can_tx_pin: GPIO4
  can_rx_pin: GPIO5

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: "TUAN BIEN"
  password: "76767676"

ota:
  platform: esphome

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${jk_bms_mac}
    id: client0

external_components:
  - source: github://syssi/esphome-jk-bms@main
    refresh: 0s

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0

canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: ${can_tx_pin}
    rx_pin: ${can_rx_pin}
    bit_rate: 500kbps

interval:
  - interval: 1000ms
    then:
      # Gửi giới hạn sạc xả Pylontech (ID 0x351): 28.4V | 70A | 75A | 25.0V
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x351
          data: [0x18, 0x01, 0xBC, 0x02, 0xEE, 0x02, 0xFA, 0x00]
      # Gửi SoC & SoH (ID 0x355)
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x355
          data: !lambda |-
            uint16_t soc = (uint16_t)id(state_of_charge).state;
            uint16_t soh = 100;
            return {
              (uint8_t)(soc & 0xFF), (uint8_t)(soc >> 8),
              (uint8_t)(soh & 0xFF), (uint8_t)(soh >> 8),
              0x00, 0x00, 0x00, 0x00
            };
      # Gửi Điện áp, Dòng điện, Nhiệt độ (ID 0x356)
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x356
          data: !lambda |-
            int16_t volt = (int16_t)(id(total_voltage).state * 100);
            int16_t curr = (int16_t)(id(current).state * 10);
            int16_t temp = (int16_t)(id(temp_1).state * 10);
            return {
              (uint8_t)(volt & 0xFF), (uint8_t)(volt >> 8),
              (uint8_t)(curr & 0xFF), (uint8_t)(curr >> 8),
              (uint8_t)(temp & 0xFF), (uint8_t)(temp >> 8),
              0x00, 0x00
            };
      # Gửi cờ cho phép sạc/xả Pylontech (ID 0x35C)
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35C
          data: [0xC0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      # Gửi định danh PYLON (ID 0x35E)
      - canbus.send:
          canbus_id: can_bus
          can_id: 0x35E
          data: [0x50, 0x59, 0x4C, 0x4F, 0x4E, 0x20, 0x20, 0x20]

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    total_voltage:
      name: "Battery Voltage"
      id: total_voltage
    current:
      name: "Battery Current"
      id: current
    state_of_charge:
      name: "Battery SoC"
      id: state_of_charge
    temperature_sensor_1:
      name: "Battery Temp 1"
      id: temp_1
