name: Build ESPHome Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ESPHome and Build
        run: |
          pip install esphome
          esphome compile jkbms.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: .esphome/build/*/.pioenvs/*/firmware.factory.bin
